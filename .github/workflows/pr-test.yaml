name: Test PR

on: pull_request

jobs:
  build:
    name: Test PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[controller]"
      - name: Run tests
        run: python -m unittest discover -v
